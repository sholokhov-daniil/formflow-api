components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: Use the user's email as the username.
  responses:
    BasicUnauthorized:
      description: HTTP Basic credentials are missing or invalid.
      headers:
        WWW-Authenticate:
          description: HTTP authentication scheme required by this endpoint.
          schema:
            type: string
          example: Basic
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: Invalid credentials.
    WorkspaceAccessDenied:
      description: Not a workspace member.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ScopedResourceNotFound:
      description: Resource not found in the bound hierarchy.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    AuthenticationLimited:
      description: Too many failed authentication attempts for this client IP and Basic
        username.
      headers:
        Retry-After:
          description: Seconds remaining until another authentication attempt is allowed;
            matches retry_after in the response body.
          required: true
          schema:
            type: integer
            minimum: 1
          example: 10800
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthenticationRateLimitError'
          example:
            message: Too many failed authentication attempts.
            retry_after: 10800
    InvalidJsonInput:
      description: Invalid JSON input.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
  schemas:
    CreateProjectRequest:
      type: object
      required:
        - name
        - description
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: 'Unique within the workspace.'
        description:
          type: string
          minLength: 1
          maxLength: 255
    ReplaceProjectRequest:
      type: object
      required:
        - name
        - description
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: 'Unique within the workspace.'
        description:
          type: string
          minLength: 1
          maxLength: 255
    PatchProjectRequest:
      type: object
      anyOf:
        -
          required:
            - name
        -
          required:
            - description
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: 'Unique within the workspace.'
        description:
          type: string
          minLength: 1
          maxLength: 255
    Project:
      type: object
      additionalProperties: false
      required:
        - id
        - workspace_id
        - name
        - description
      properties:
        id:
          type: string
          format: uuid
        workspace_id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
    ProjectDetail:
      type: object
      additionalProperties: false
      required:
        - id
        - workspace_id
        - name
        - description
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        workspace_id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        created_at:
          type:
            - string
            - 'null'
          format: date-time
        updated_at:
          type:
            - string
            - 'null'
          format: date-time
    ProjectDetailResponse:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/ProjectDetail'
    ProjectList:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Project'
    CreateWorkspaceRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - kind
      properties:
        name:
          type: string
          maxLength: 255
        kind:
          type: string
          enum:
            - personal
            - team
    ReplaceWorkspaceRequest:
      type: object
      required:
        - name
        - kind
      properties:
        name:
          type: string
          maxLength: 255
        kind:
          type: string
          enum:
            - personal
            - team
    PatchWorkspaceRequest:
      type: object
      anyOf:
        - required:
            - name
        - required:
            - kind
      properties:
        name:
          type: string
          maxLength: 255
        kind:
          type: string
          enum:
            - personal
            - team
    Workspace:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - kind
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        kind:
          type: string
          enum:
            - personal
            - team
    WorkspaceDetail:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - kind
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        kind:
          type: string
          enum:
            - personal
            - team
        created_at:
          type: [string, "null"]
          format: date-time
        updated_at:
          type: [string, "null"]
          format: date-time
    WorkspaceDetailResponse:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/WorkspaceDetail'
    WorkspaceList:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Workspace'
    Error:
      type: object
      description: Standard error response when application debug mode is disabled.
      additionalProperties: false
      required:
        - message
      properties:
        message:
          type: string
    ValidationError:
      type: object
      additionalProperties: false
      required:
        - message
        - errors
      properties:
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
    AuthenticationRateLimitError:
      type: object
      additionalProperties: false
      required:
        - message
        - retry_after
      properties:
        message:
          type: string
        retry_after:
          type: integer
          minimum: 1
          description: Seconds remaining until the authentication block expires.

    Form:
      type: object
      additionalProperties: false
      required:
      - id
      - project_id
      - name
      - settings
      - active
      - created_by
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        name:
          type: string
        settings:
          type:
          - object
          - array
          - 'null'
        active:
          type: boolean
        created_by:
          type: integer
    FormDetail:
      type: object
      additionalProperties: false
      required:
      - id
      - project_id
      - name
      - settings
      - active
      - created_by
      - created_at
      - updated_at
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        name:
          type: string
        settings:
          type:
          - object
          - array
          - 'null'
        active:
          type: boolean
        created_by:
          type: integer
        created_at:
          type:
          - string
          - 'null'
          format: date-time
        updated_at:
          type:
          - string
          - 'null'
          format: date-time
    FormDetailResponse:
      type: object
      additionalProperties: false
      required:
      - data
