openapi: 3.1.0
info:
  title: FormFlow API
  version: 1.0.0
tags:
  - name: Workspaces
    description: Workspaces accessible to the authenticated user.
  - name: Projects
    description: Projects belonging to a workspace, accessible to its members.
paths:
  /api/v1/workspaces:
    get:
      tags:
        - Workspaces
      operationId: listWorkspaces
      summary: List accessible workspaces
      description: |
        Returns only workspaces where the authenticated user has a membership.
        Personal and team workspaces are included. Results are ordered by name
        and then by UUID, ascending, and are not paginated. Users without
        memberships receive an empty data array.

        Authenticate using HTTP Basic authentication with the user's email as
        the username and their password. Use HTTPS outside local development.

        Failed authentication attempts are counted per client IP address and
        Basic username. The third failure within a three-hour window returns
        429 and blocks that combination for three hours from that failure.
        Requests during the block, including requests with valid credentials,
        return 429 without extending the block. Successful authentication before
        a block resets the failure count, even if authorization returns 403.
      security:
        - basicAuth: []
      responses:
        '200':
          description: Accessible workspaces, including an empty list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceList'
              examples:
                workspaces:
                  summary: Personal and team workspaces
                  value:
                    data:
                      - id: 019a0000-0000-7000-8000-000000000001
                        name: Alpha personal
                        kind: personal
                      - id: 019a0000-0000-7000-8000-000000000002
                        name: Beta team
                        kind: team
                empty:
                  summary: User without memberships
                  value:
                    data: []
        '401':
          description: HTTP Basic credentials are missing or invalid.
          headers:
            WWW-Authenticate:
              description: HTTP authentication scheme required by this endpoint.
              schema:
                type: string
              example: Basic
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Invalid credentials.
        '403':
          description: The viewAny authorization check denied the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: This action is unauthorized.
        '429':
          description: Too many failed authentication attempts for this client IP and Basic username.
          headers:
            Retry-After:
              description: Seconds remaining until another authentication attempt is allowed; matches retry_after in the response body.
              required: true
              schema:
                type: integer
                minimum: 1
              example: 10800
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationRateLimitError'
              example:
                message: Too many failed authentication attempts.
                retry_after: 10800
    post:
      tags:
        - Workspaces
      operationId: createWorkspace
      summary: Create a workspace
      description: |
        Creates a workspace and adds the authenticated user as its first member.
        Authenticate using HTTP Basic authentication with the user's email as
        the username and their password. Use HTTPS outside local development.

        Failed authentication attempts are counted per client IP address and
        Basic username. The third failure within a three-hour window returns
        429 and blocks that combination for three hours from that failure.
      security:
        - basicAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkspaceRequest'
            example:
              name: Product team
              kind: team
      responses:
        '201':
          description: Workspace created. The response contains its detailed representation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceDetailResponse'
              example:
                data:
                  id: 019a0000-0000-7000-8000-000000000001
                  name: Product team
                  kind: team
                  created_at: '2026-10-20T10:00:00.000000Z'
                  updated_at: '2026-10-20T10:00:00.000000Z'
        '401':
          description: HTTP Basic credentials are missing or invalid.
          headers:
            WWW-Authenticate:
              description: HTTP authentication scheme required by this endpoint.
              schema:
                type: string
              example: Basic
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Invalid credentials.
        '403':
          description: The create authorization check denied the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: This action is unauthorized.
        '422':
          description: The request body failed validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              example:
                message: The name field is required.
                errors:
                  name:
                    - The name field is required.
        '429':
          description: Too many failed authentication attempts for this client IP and Basic username.
          headers:
            Retry-After:
              description: Seconds remaining until another authentication attempt is allowed; matches retry_after in the response body.
              required: true
              schema:
                type: integer
                minimum: 1
              example: 10800
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationRateLimitError'
              example:
                message: Too many failed authentication attempts.
                retry_after: 10800
  /api/v1/workspaces/{workspace}:
    get:
      tags:
        - Workspaces
      operationId: showWorkspace
      summary: Get workspace details
      description: |
        Returns detailed information about a workspace, including creation and
        update timestamps. The authenticated user must be a workspace member.
        Authentication and failed-attempt limits are the same as for the
        workspace list endpoint.
      security:
        - basicAuth: []
      parameters:
        - name: workspace
          in: path
          required: true
          description: Workspace UUID.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Workspace details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceDetailResponse'
              example:
                data:
                  id: 019a0000-0000-7000-8000-000000000001
                  name: Alpha personal
                  kind: personal
                  created_at: '2026-10-20T10:00:00.000000Z'
                  updated_at: '2026-10-20T12:30:00.000000Z'
        '401':
          description: HTTP Basic credentials are missing or invalid.
          headers:
            WWW-Authenticate:
              description: HTTP authentication scheme required by this endpoint.
              schema:
                type: string
              example: Basic
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Invalid credentials.
        '403':
          description: The authenticated user is not a workspace member.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: This action is unauthorized.
        '404':
          description: The workspace was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: The route or resource was not found.
        '429':
          description: Too many failed authentication attempts for this client IP and Basic username.
          headers:
            Retry-After:
              description: Seconds remaining until another authentication attempt is allowed; matches retry_after in the response body.
              required: true
              schema:
                type: integer
                minimum: 1
              example: 10800
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationRateLimitError'
              example:
                message: Too many failed authentication attempts.
                retry_after: 10800
    put:
      tags:
        - Workspaces
      operationId: replaceWorkspace
      summary: Replace workspace details
      description: |
        Replaces the workspace's editable properties. Both name and kind are
        required. Values must be sent in a JSON request body; query parameters
        and form data are ignored. The authenticated user must be a workspace
        member.

        Authenticate using HTTP Basic authentication with the user's email as
        the username and their password. Use HTTPS outside local development.
        Failed authentication attempts are counted per client IP address and
        Basic username. The third failure within a three-hour window returns
        429 and blocks that combination for three hours from that failure.
      security:
        - basicAuth: []
      parameters:
        - name: workspace
          in: path
          required: true
          description: Workspace UUID.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceWorkspaceRequest'
            example:
              name: Product team
              kind: team
      responses:
        '200':
          description: Workspace updated. The response contains its detailed representation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceDetailResponse'
              example:
                data:
                  id: 019a0000-0000-7000-8000-000000000001
                  name: Product team
                  kind: team
                  created_at: '2026-10-20T10:00:00.000000Z'
                  updated_at: '2026-10-20T12:30:00.000000Z'
        '401':
          description: HTTP Basic credentials are missing or invalid.
          headers:
            WWW-Authenticate:
              description: HTTP authentication scheme required by this endpoint.
              schema:
                type: string
              example: Basic
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Invalid credentials.
        '403':
          description: The authenticated user is not a workspace member.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: This action is unauthorized.
        '404':
          description: The workspace was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: The route or resource was not found.
        '422':
          description: The JSON request body failed validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              example:
                message: The name field is required.
                errors:
                  name:
                    - The name field is required.
        '429':
          description: Too many failed authentication attempts for this client IP and Basic username.
          headers:
            Retry-After:
              description: Seconds remaining until another authentication attempt is allowed; matches retry_after in the response body.
              required: true
              schema:
                type: integer
                minimum: 1
              example: 10800
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationRateLimitError'
              example:
                message: Too many failed authentication attempts.
                retry_after: 10800
    patch:
      tags:
        - Workspaces
      operationId: patchWorkspace
      summary: Partially update workspace details
      description: |
        Updates one or more editable workspace properties. At least one of name
        or kind is required. Values must be sent in a JSON request body; query
        parameters and form data are ignored. The authenticated user must be a
        workspace member.

        Authenticate using HTTP Basic authentication with the user's email as
        the username and their password. Use HTTPS outside local development.
        Failed authentication attempts are counted per client IP address and
        Basic username. The third failure within a three-hour window returns
        429 and blocks that combination for three hours from that failure.
      security:
        - basicAuth: []
      parameters:
        - name: workspace
          in: path
          required: true
          description: Workspace UUID.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchWorkspaceRequest'
            example:
              name: Product team
      responses:
        '200':
          description: Workspace updated. The response contains its detailed representation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceDetailResponse'
              example:
                data:
                  id: 019a0000-0000-7000-8000-000000000001
                  name: Product team
                  kind: team
                  created_at: '2026-10-20T10:00:00.000000Z'
                  updated_at: '2026-10-20T12:30:00.000000Z'
        '401':
          description: HTTP Basic credentials are missing or invalid.
          headers:
            WWW-Authenticate:
              description: HTTP authentication scheme required by this endpoint.
              schema:
                type: string
              example: Basic
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Invalid credentials.
        '403':
          description: The authenticated user is not a workspace member.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: This action is unauthorized.
        '404':
          description: The workspace was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: The route or resource was not found.
        '422':
          description: The JSON request body failed validation, or no editable property was provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              example:
                message: Provide at least one field to update.
                errors:
                  name:
                    - Provide at least one field to update.
        '429':
          description: Too many failed authentication attempts for this client IP and Basic username.
          headers:
            Retry-After:
              description: Seconds remaining until another authentication attempt is allowed; matches retry_after in the response body.
              required: true
              schema:
                type: integer
                minimum: 1
              example: 10800
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationRateLimitError'
              example:
                message: Too many failed authentication attempts.
                retry_after: 10800
    delete:
      tags:
        - Workspaces
      operationId: deleteWorkspace
      summary: Delete a workspace
      description: |
        Deletes the workspace if the authenticated user is a member. Database
        foreign keys cascade the deletion to its memberships, projects, forms,
        form fields, submissions, and submission values.
        Authenticate using HTTP Basic authentication with the user's email as
        the username and their password. Use HTTPS outside local development.

        Failed authentication attempts are counted per client IP address and
        Basic username. The third failure within a three-hour window returns
        429 and blocks that combination for three hours from that failure.
      security:
        - basicAuth: []
      parameters:
        - name: workspace
          in: path
          required: true
          description: Workspace UUID.
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Workspace and its related records were deleted.
        '401':
          description: HTTP Basic credentials are missing or invalid.
          headers:
            WWW-Authenticate:
              description: HTTP authentication scheme required by this endpoint.
              schema:
                type: string
              example: Basic
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Invalid credentials.
        '403':
          description: The authenticated user is not a workspace member.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: This action is unauthorized.
        '404':
          description: The workspace was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: The route or resource was not found.
        '429':
          description: Too many failed authentication attempts for this client IP and Basic username.
          headers:
            Retry-After:
              description: Seconds remaining until another authentication attempt is allowed; matches retry_after in the response body.
              required: true
              schema:
                type: integer
                minimum: 1
              example: 10800
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationRateLimitError'
              example:
                message: Too many failed authentication attempts.
                retry_after: 10800
  '/api/v1/workspaces/{workspace}/projects':
    parameters:
      -
        name: workspace
        in: path
        required: true
        description: 'Workspace UUID.'
        schema:
          type: string
          format: uuid
    get:
      tags:
        - Projects
      operationId: listProjects
      summary: 'List workspace projects'
      description: |-
        Returns only projects in the requested workspace. The user must be a workspace member. Results are ordered by name and UUID, ascending, without pagination. An empty workspace returns an empty data array.

        Authenticate using HTTP Basic with the user's email and password. Use HTTPS outside local development. The third failed authentication attempt within a three-hour window blocks the client IP and Basic username combination for three hours and returns 429.
      security:
        -
          basicAuth: []
      responses:
        '200':
          description: 'List workspace projects.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectList'
              example:
                data:
                  -
                    id: 019a0000-0000-7000-8000-000000000010
                    workspace_id: 019a0000-0000-7000-8000-000000000001
                    name: 'Customer feedback'
                    description: 'Feedback forms'
        '401':
          description: 'HTTP Basic credentials are missing or invalid.'
          headers:
            WWW-Authenticate:
              description: 'HTTP authentication scheme required by this endpoint.'
              schema:
                type: string
              example: Basic
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: 'Invalid credentials.'
        '403':
          description: 'The authenticated user is not a workspace member.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: 'This action is unauthorized.'
        '404':
          description: 'The workspace or project was not found, or the project belongs to a different workspace.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: 'The route or resource was not found.'
        '429':
          description: 'Too many failed authentication attempts for this client IP and Basic username.'
          headers:
            Retry-After:
              description: 'Seconds remaining until another authentication attempt is allowed; matches retry_after in the response body.'
              required: true
              schema:
                type: integer
                minimum: 1
              example: 10800
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationRateLimitError'
              example:
                message: 'Too many failed authentication attempts.'
                retry_after: 10800
    post:
      tags:
        - Projects
      operationId: createProject
      summary: 'Create a project'
      description: |-
        Creates a project in the workspace from the URL. Both name and description are required, non-empty strings of at most 255 characters. Names must be unique within this workspace; the same name may be used in another workspace. Only JSON body properties are accepted. Extra properties, including id and workspace_id, are ignored. The user must be a workspace member.

        Authenticate using HTTP Basic with the user's email and password. Use HTTPS outside local development. The third failed authentication attempt within a three-hour window blocks the client IP and Basic username combination for three hours and returns 429.
      security:
        -
          basicAuth: []
      responses:
        '201':
          description: 'Create a project.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectDetailResponse'
              example:
                data:
                  id: 019a0000-0000-7000-8000-000000000010
                  workspace_id: 019a0000-0000-7000-8000-000000000001
                  name: 'Customer feedback'
                  description: 'Feedback forms'
                  created_at: '2026-10-20T10:00:00.000000Z'
                  updated_at: '2026-10-20T10:00:00.000000Z'
        '401':
          description: 'HTTP Basic credentials are missing or invalid.'
          headers:
            WWW-Authenticate:
              description: 'HTTP authentication scheme required by this endpoint.'
              schema:
                type: string
              example: Basic
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: 'Invalid credentials.'
        '403':
          description: 'The authenticated user is not a workspace member.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: 'This action is unauthorized.'
        '404':
          description: 'The workspace or project was not found, or the project belongs to a different workspace.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: 'The route or resource was not found.'
        '429':
          description: 'Too many failed authentication attempts for this client IP and Basic username.'
          headers:
            Retry-After:
              description: 'Seconds remaining until another authentication attempt is allowed; matches retry_after in the response body.'
              required: true
              schema:
                type: integer
                minimum: 1
              example: 10800
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationRateLimitError'
              example:
                message: 'Too many failed authentication attempts.'
                retry_after: 10800
        '422':
          description: 'Invalid JSON body, missing or invalid editable properties, or a duplicate project name in this workspace.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              example:
                message: 'The name field is required.'
                errors:
                  name:
                    - 'The name field is required.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
            example:
              name: 'Customer feedback'
              description: 'Feedback forms'
  '/api/v1/workspaces/{workspace}/projects/{project}':
    parameters:
      -
        name: workspace
        in: path
        required: true
        description: 'Workspace UUID.'
        schema:
          type: string
          format: uuid
      -
        name: project
        in: path
        required: true
        description: 'Project UUID belonging to this workspace.'
        schema:
          type: string
          format: uuid
    get:
      tags:
        - Projects
      operationId: showProject
      summary: 'Get project details'
      description: |-
        Returns project details and timestamps. The project must belong to the workspace from the URL, and the user must be a workspace member.

        Authenticate using HTTP Basic with the user's email and password. Use HTTPS outside local development. The third failed authentication attempt within a three-hour window blocks the client IP and Basic username combination for three hours and returns 429.
      security:
        -
          basicAuth: []
      responses:
        '200':
          description: 'Get project details.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectDetailResponse'
              example:
                data:
                  id: 019a0000-0000-7000-8000-000000000010
                  workspace_id: 019a0000-0000-7000-8000-000000000001
                  name: 'Customer feedback'
                  description: 'Feedback forms'
                  created_at: '2026-10-20T10:00:00.000000Z'
                  updated_at: '2026-10-20T10:00:00.000000Z'
        '401':
          description: 'HTTP Basic credentials are missing or invalid.'
          headers:
            WWW-Authenticate:
              description: 'HTTP authentication scheme required by this endpoint.'
              schema:
                type: string
              example: Basic
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: 'Invalid credentials.'
        '403':
          description: 'The authenticated user is not a workspace member.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: 'This action is unauthorized.'
        '404':
          description: 'The workspace or project was not found, or the project belongs to a different workspace.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: 'The route or resource was not found.'
        '429':
          description: 'Too many failed authentication attempts for this client IP and Basic username.'
          headers:
            Retry-After:
              description: 'Seconds remaining until another authentication attempt is allowed; matches retry_after in the response body.'
              required: true
              schema:
                type: integer
                minimum: 1
              example: 10800
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationRateLimitError'
              example:
                message: 'Too many failed authentication attempts.'
                retry_after: 10800
    put:
      tags:
        - Projects
      operationId: replaceProject
      summary: 'Replace project details'
      description: |-
        Replaces both name and description. Both properties are required, non-empty strings of at most 255 characters. The name must be unique within the workspace, excluding this project. Only JSON body properties are accepted; query parameters and form data are ignored. Extra properties are ignored; id and workspace_id cannot be changed. The user must be a workspace member.

        Authenticate using HTTP Basic with the user's email and password. Use HTTPS outside local development. The third failed authentication attempt within a three-hour window blocks the client IP and Basic username combination for three hours and returns 429.
      security:
        -
          basicAuth: []
      responses:
        '200':
          description: 'Replace project details.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectDetailResponse'
              example:
                data:
                  id: 019a0000-0000-7000-8000-000000000010
                  workspace_id: 019a0000-0000-7000-8000-000000000001
                  name: 'Customer feedback'
                  description: 'Feedback forms'
                  created_at: '2026-10-20T10:00:00.000000Z'
                  updated_at: '2026-10-20T10:00:00.000000Z'
        '401':
          description: 'HTTP Basic credentials are missing or invalid.'
          headers:
            WWW-Authenticate:
              description: 'HTTP authentication scheme required by this endpoint.'
              schema:
                type: string
              example: Basic
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: 'Invalid credentials.'
        '403':
          description: 'The authenticated user is not a workspace member.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: 'This action is unauthorized.'
        '404':
          description: 'The workspace or project was not found, or the project belongs to a different workspace.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: 'The route or resource was not found.'
        '429':
          description: 'Too many failed authentication attempts for this client IP and Basic username.'
          headers:
            Retry-After:
              description: 'Seconds remaining until another authentication attempt is allowed; matches retry_after in the response body.'
              required: true
              schema:
                type: integer
                minimum: 1
              example: 10800
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationRateLimitError'
              example:
                message: 'Too many failed authentication attempts.'
                retry_after: 10800
        '422':
          description: 'Invalid JSON body, missing or invalid editable properties, or a duplicate project name in this workspace.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              example:
                message: 'The name field is required.'
                errors:
                  name:
                    - 'The name field is required.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceProjectRequest'
            example:
              name: 'Customer feedback'
              description: 'Feedback forms'
    patch:
      tags:
        - Projects
      operationId: patchProject
      summary: 'Partially update project details'
      description: |-
        Updates supplied name and/or description properties, preserving omitted properties. At least one editable property must be provided. Supplied values must be non-empty strings of at most 255 characters; null is not accepted. The name must be unique within the workspace, excluding this project. Only JSON body properties are accepted; query parameters and form data are ignored. Extra properties are ignored; id and workspace_id cannot be changed. The user must be a workspace member.

        Authenticate using HTTP Basic with the user's email and password. Use HTTPS outside local development. The third failed authentication attempt within a three-hour window blocks the client IP and Basic username combination for three hours and returns 429.
      security:
        -
          basicAuth: []
      responses:
        '200':
          description: 'Partially update project details.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectDetailResponse'
              example:
                data:
                  id: 019a0000-0000-7000-8000-000000000010
                  workspace_id: 019a0000-0000-7000-8000-000000000001
                  name: 'Customer feedback'
                  description: 'Feedback forms'
                  created_at: '2026-10-20T10:00:00.000000Z'
                  updated_at: '2026-10-20T10:00:00.000000Z'
        '401':
          description: 'HTTP Basic credentials are missing or invalid.'
          headers:
            WWW-Authenticate:
              description: 'HTTP authentication scheme required by this endpoint.'
              schema:
                type: string
              example: Basic
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: 'Invalid credentials.'
        '403':
          description: 'The authenticated user is not a workspace member.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: 'This action is unauthorized.'
        '404':
          description: 'The workspace or project was not found, or the project belongs to a different workspace.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: 'The route or resource was not found.'
        '429':
          description: 'Too many failed authentication attempts for this client IP and Basic username.'
          headers:
            Retry-After:
              description: 'Seconds remaining until another authentication attempt is allowed; matches retry_after in the response body.'
              required: true
              schema:
                type: integer
                minimum: 1
              example: 10800
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationRateLimitError'
              example:
                message: 'Too many failed authentication attempts.'
                retry_after: 10800
        '422':
          description: 'Invalid JSON body, missing or invalid editable properties, or a duplicate project name in this workspace.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              example:
                message: 'The name field is required.'
                errors:
                  name:
                    - 'The name field is required.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchProjectRequest'
            example:
              name: 'Renamed project'
    delete:
      tags:
        - Projects
      operationId: deleteProject
      summary: 'Delete a project'
      description: |-
        Deletes the project and cascades deletion to its forms, fields, submissions and submission values. The user must be a workspace member. Other projects and the workspace are preserved.

        Authenticate using HTTP Basic with the user's email and password. Use HTTPS outside local development. The third failed authentication attempt within a three-hour window blocks the client IP and Basic username combination for three hours and returns 429.
      security:
        -
          basicAuth: []
      responses:
        '204':
          description: 'Project and its related records were deleted.'
        '401':
          description: 'HTTP Basic credentials are missing or invalid.'
          headers:
            WWW-Authenticate:
              description: 'HTTP authentication scheme required by this endpoint.'
              schema:
                type: string
              example: Basic
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: 'Invalid credentials.'
        '403':
          description: 'The authenticated user is not a workspace member.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: 'This action is unauthorized.'
        '404':
          description: 'The workspace or project was not found, or the project belongs to a different workspace.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: 'The route or resource was not found.'
        '429':
          description: 'Too many failed authentication attempts for this client IP and Basic username.'
          headers:
            Retry-After:
              description: 'Seconds remaining until another authentication attempt is allowed; matches retry_after in the response body.'
              required: true
              schema:
                type: integer
                minimum: 1
              example: 10800
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationRateLimitError'
              example:
                message: 'Too many failed authentication attempts.'
                retry_after: 10800
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: Use the user's email as the username.
  schemas:
    CreateProjectRequest:
      type: object
      required:
        - name
        - description
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: 'Unique within the workspace.'
        description:
          type: string
          minLength: 1
          maxLength: 255
    ReplaceProjectRequest:
      type: object
      required:
        - name
        - description
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: 'Unique within the workspace.'
        description:
          type: string
          minLength: 1
          maxLength: 255
    PatchProjectRequest:
      type: object
      anyOf:
        -
          required:
            - name
        -
          required:
            - description
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: 'Unique within the workspace.'
        description:
          type: string
          minLength: 1
          maxLength: 255
    Project:
      type: object
      additionalProperties: false
      required:
        - id
        - workspace_id
        - name
        - description
      properties:
        id:
          type: string
          format: uuid
        workspace_id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
    ProjectDetail:
      type: object
      additionalProperties: false
      required:
        - id
        - workspace_id
        - name
        - description
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        workspace_id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        created_at:
          type:
            - string
            - 'null'
          format: date-time
        updated_at:
          type:
            - string
            - 'null'
          format: date-time
    ProjectDetailResponse:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/ProjectDetail'
    ProjectList:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Project'
    CreateWorkspaceRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - kind
      properties:
        name:
          type: string
          maxLength: 255
        kind:
          type: string
          enum:
            - personal
            - team
    ReplaceWorkspaceRequest:
      type: object
      required:
        - name
        - kind
      properties:
        name:
          type: string
          maxLength: 255
        kind:
          type: string
          enum:
            - personal
            - team
    PatchWorkspaceRequest:
      type: object
      anyOf:
        - required:
            - name
        - required:
            - kind
      properties:
        name:
          type: string
          maxLength: 255
        kind:
          type: string
          enum:
            - personal
            - team
    Workspace:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - kind
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        kind:
          type: string
          enum:
            - personal
            - team
    WorkspaceDetail:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - kind
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        kind:
          type: string
          enum:
            - personal
            - team
        created_at:
          type: [string, "null"]
          format: date-time
        updated_at:
          type: [string, "null"]
          format: date-time
    WorkspaceDetailResponse:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/WorkspaceDetail'
    WorkspaceList:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Workspace'
    Error:
      type: object
      description: Standard error response when application debug mode is disabled.
      additionalProperties: false
      required:
        - message
      properties:
        message:
          type: string
    ValidationError:
      type: object
      additionalProperties: false
      required:
        - message
        - errors
      properties:
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
    AuthenticationRateLimitError:
      type: object
      additionalProperties: false
      required:
        - message
        - retry_after
      properties:
        message:
          type: string
        retry_after:
          type: integer
          minimum: 1
          description: Seconds remaining until the authentication block expires.
