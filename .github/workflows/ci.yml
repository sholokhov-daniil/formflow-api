
name: Laravel CI

on:
  push:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  tests:
    name: Laravel tests
    runs-on: ubuntu-24.04

    env:
      APP_ENV: testing

      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: formflow_test
      DB_USERNAME: formflow
      DB_PASSWORD: test_password

      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: formflow_test
          POSTGRES_USER: formflow
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U formflow -d formflow_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, xml, curl, pdo_pgsql, pgsql, redis
          coverage: none
          tools: composer:v2

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare Laravel environment
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan config:clear

      - name: Run database migrations
        run: php artisan migrate --force

      - name: Run Laravel tests
        run: php artisan test --stop-on-failure
